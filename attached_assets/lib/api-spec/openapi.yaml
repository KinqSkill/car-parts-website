openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Performance parts catalog and quote requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storefront:
    get:
      operationId: getStorefront
      tags: [store]
      summary: Get storefront overview
      responses:
        "200":
          description: Storefront overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storefront"
  /categories:
    get:
      operationId: listCategories
      tags: [store]
      summary: List product categories
      responses:
        "200":
          description: Product categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [store]
      summary: Search and filter auto parts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: vehicle
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching auto parts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [store]
      summary: Get one auto part
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Auto part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /quote-requests:
    post:
      operationId: createQuoteRequest
      tags: [store]
      summary: Submit a request for a product quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestInput"
      responses:
        "201":
          description: Quote request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
        "400":
          description: Invalid request or unknown products
  /newsletter:
    post:
      operationId: subscribeToNewsletter
      tags: [store]
      summary: Subscribe an email address to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "201":
          description: Subscription recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Storefront:
      type: object
      required: [currency, promoMessage, freeShippingThreshold, featuredProducts]
      properties:
        currency:
          type: string
        promoMessage:
          type: string
        freeShippingThreshold:
          type: number
        featuredProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    Category:
      type: object
      required: [slug, name, productCount]
      properties:
        slug:
          type: string
        name:
          type: string
        productCount:
          type: integer
    Product:
      type: object
      required:
        - id
        - name
        - description
        - sku
        - category
        - compatibleVehicles
        - technicalSpecs
        - imageUrl
        - isFeatured
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        sku:
          type: string
        category:
          type: string
        compatibleVehicles:
          type: array
          items:
            type: string
        technicalSpecs:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        isFeatured:
          type: boolean
    QuoteRequestInput:
      type: object
      required: [fullName, phone, vehicleMake, vehicleModel, items]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: ["string", "null"]
          format: email
        vehicleMake:
          type: string
          minLength: 1
          maxLength: 80
        vehicleModel:
          type: string
          minLength: 1
          maxLength: 120
        vehicleYear:
          type: ["string", "null"]
          maxLength: 12
        vin:
          type: ["string", "null"]
          maxLength: 40
        message:
          type: ["string", "null"]
          maxLength: 1200
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuoteItemInput"
    QuoteItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    QuoteRequest:
      type: object
      required: [id, fullName, phone, vehicleMake, vehicleModel, items, status, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
          format: email
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        vehicleYear:
          type: ["string", "null"]
        vin:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
        status:
          type: string
          enum: [received]
        createdAt:
          type: string
          format: date-time
    QuoteItem:
      type: object
      required: [productId, productName, sku, quantity]
      properties:
        productId:
          type: integer
        productName:
          type: string
        sku:
          type: string
        quantity:
          type: integer
    NewsletterInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    NewsletterResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

